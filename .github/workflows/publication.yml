name: Publication artifacts

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare, verify, or publish and resume a retained set
        type: choice
        options: [prepare, verify, publish]
        required: true
      tooling:
        description: Full machinery commit SHA (optional repair, defaults to this run SHA)
      auth:
        description: npm publication authentication (publish only)
        type: choice
        options: [trusted, bootstrap]
        default: trusted
      source:
        description: Full release commit SHA
        required: true
      base:
        description: Original release base SHA (prepare only)
      title:
        description: Guard-validated release title (prepare only)
      run:
        description: Original Actions run ID (verify or publish)
      artifact:
        description: Original Actions artifact ID (verify or publish)
      digest:
        description: Recorded manifest SHA-256 (verify or publish)

permissions:
  contents: read
  actions: read

concurrency:
  group: publication-artifacts
  cancel-in-progress: false
  queue: max

jobs:
  selection:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.select.outputs.auth }}
      base: ${{ steps.select.outputs.base }}
      mode: ${{ steps.select.outputs.mode }}
      publish: ${{ steps.select.outputs.publish }}
      source: ${{ steps.select.outputs.source }}
      title: ${{ steps.select.outputs.title }}
      tooling: ${{ steps.select.outputs.tooling }}
    steps:
      - name: Validate tooling input
        env:
          TOOLING: ${{ inputs.tooling }}
        run: |
          if [[ -n "$TOOLING" && ! "$TOOLING" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Tooling must be a full commit SHA." >&2
            exit 1
          fi
      - name: Check out selection tooling
        uses: actions/checkout@v7
        with:
          path: tools
          ref: ${{ inputs.tooling || github.sha }}
          persist-credentials: false
      - name: Select publication
        id: select
        uses: actions/github-script@v9
        env:
          MODE: ${{ inputs.mode }}
          AUTH: ${{ inputs.auth }}
          SOURCE: ${{ inputs.source }}
          BASE: ${{ inputs.base }}
          TITLE: ${{ inputs.title }}
          TOOLING: ${{ inputs.tooling }}
        with:
          script: |
            const select = require(`${process.env.GITHUB_WORKSPACE}/tools/scripts/publication-selection.cjs`);
            await select({ github, context, core, env: process.env });
  retain:
    if: needs.selection.outputs.source != ''
    needs: selection
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id || steps.inputs.outputs.artifact }}
      run: ${{ steps.inputs.outputs.run }}
      digest: ${{ steps.identity.outputs.digest || steps.inputs.outputs.digest }}
    steps:
      - name: Check out tooling
        uses: actions/checkout@v7
        with:
          path: tools
          ref: ${{ needs.selection.outputs.tooling }}
          persist-credentials: false
      - name: Validate artifact selection
        id: inputs
        uses: actions/github-script@v9
        env:
          MODE: ${{ needs.selection.outputs.mode }}
          SOURCE: ${{ needs.selection.outputs.source }}
          BASE: ${{ needs.selection.outputs.base }}
          TITLE: ${{ needs.selection.outputs.title }}
          RETAINED_RUN: ${{ inputs.run }}
          RETAINED_ARTIFACT: ${{ inputs.artifact }}
          RETAINED_DIGEST: ${{ inputs.digest }}
        with:
          script: |
            const ledger = require(`${process.env.GITHUB_WORKSPACE}/tools/scripts/publication-ledger.cjs`);
            await ledger({ github, context, core, env: process.env });
      - name: Check out release history
        if: needs.selection.outputs.mode == 'prepare' || steps.inputs.outputs.prepare == 'true'
        uses: actions/checkout@v7
        with:
          path: source
          ref: ${{ needs.selection.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        if: needs.selection.outputs.mode == 'prepare' || steps.inputs.outputs.prepare == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.2
      - name: Set up Node.js
        if: needs.selection.outputs.mode == 'prepare' || steps.inputs.outputs.prepare == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Build tooling
        if: needs.selection.outputs.mode == 'prepare' || steps.inputs.outputs.prepare == 'true'
        working-directory: tools
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Prepare release artifacts
        if: needs.selection.outputs.mode == 'prepare' || steps.inputs.outputs.prepare == 'true'
        env:
          RELEASE_BASE: ${{ needs.selection.outputs.base }}
          RELEASE_SOURCE: ${{ needs.selection.outputs.source }}
          RELEASE_TITLE: ${{ needs.selection.outputs.title }}
          TOOLS_ROOT: ${{ github.workspace }}/tools
          SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          cd "$SOURCE_ROOT"
          node "$TOOLS_ROOT/apps/loom/dist/main.js" publication prepare \
            --base "$RELEASE_BASE" --head "$RELEASE_SOURCE" --title "$RELEASE_TITLE" \
            --output "$RUNNER_TEMP/release-set" > "$RUNNER_TEMP/identity.json"
      - name: Record manifest identity
        if: needs.selection.outputs.mode == 'prepare' || steps.inputs.outputs.prepare == 'true'
        id: identity
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const identity = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'identity.json'), 'utf8'));
            core.setOutput('digest', identity.digest);
            await core.summary.addCodeBlock(JSON.stringify(identity, null, 2), 'json').write();
      - name: Retain unchanged tarballs and manifest
        if: needs.selection.outputs.mode == 'prepare' || steps.inputs.outputs.prepare == 'true'
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.selection.outputs.source }}
          path: ${{ runner.temp }}/release-set
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Commit retained artifact identity
        if: needs.selection.outputs.mode == 'prepare' || steps.inputs.outputs.prepare == 'true'
        uses: actions/github-script@v9
        env:
          MODE: retain
          SOURCE: ${{ needs.selection.outputs.source }}
          RETAINED_RUN: ${{ github.run_id }}
          RETAINED_ARTIFACT: ${{ steps.upload.outputs.artifact-id }}
          RETAINED_DIGEST: ${{ steps.identity.outputs.digest }}
        with:
          script: |
            const ledger = require(`${process.env.GITHUB_WORKSPACE}/tools/scripts/publication-ledger.cjs`);
            await ledger({ github, context, core, env: process.env });

  consumers:
    needs: [selection, retain]
    name: packed / ${{ matrix.runtime }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [node, bun]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tooling
        uses: actions/checkout@v7
        with:
          path: tools
          ref: ${{ needs.selection.outputs.tooling }}
          persist-credentials: false
      - name: Check out release history
        uses: actions/checkout@v7
        with:
          path: source
          ref: ${{ needs.selection.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.2
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Build tooling
        working-directory: tools
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Download the selected artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.retain.outputs.artifact }}
          run-id: ${{ needs.retain.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-set
          merge-multiple: true
      - name: Verify retained packages without rebuilding release source
        env:
          RELEASE_SOURCE: ${{ needs.selection.outputs.source }}
          MANIFEST_DIGEST: ${{ needs.retain.outputs.digest }}
          CONSUMER_RUNTIME: ${{ matrix.runtime }}
          TOOLS_ROOT: ${{ github.workspace }}/tools
          SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          cd "$SOURCE_ROOT"
          node "$TOOLS_ROOT/apps/loom/dist/main.js" publication verify \
            --artifacts "$RUNNER_TEMP/release-set" --digest "$MANIFEST_DIGEST" \
            --head "$RELEASE_SOURCE" --runtime "$CONSUMER_RUNTIME"

  publish:
    if: needs.selection.outputs.publish == 'true'
    needs: [selection, retain, consumers]
    runs-on: ubuntu-latest
    environment: npm-publication
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Check out tooling
        uses: actions/checkout@v7
        with:
          path: tools
          ref: ${{ needs.selection.outputs.tooling }}
          persist-credentials: false
      - name: Check out release history
        uses: actions/checkout@v7
        with:
          path: source
          ref: ${{ needs.selection.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.2
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org/
      - name: Build tooling
        working-directory: tools
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Download the selected artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.retain.outputs.artifact }}
          run-id: ${{ needs.retain.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-set
          merge-multiple: true
      - name: Publish or resume the retained release
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_OPERATIONS_TOKEN }}
          PUBLICATION_AUTH: ${{ needs.selection.outputs.auth }}
          RELEASE_SOURCE: ${{ needs.selection.outputs.source }}
          MANIFEST_DIGEST: ${{ needs.retain.outputs.digest }}
          ARTIFACT_RUN: ${{ needs.retain.outputs.run }}
          ARTIFACT_ID: ${{ needs.retain.outputs.artifact }}
          TOOLS_ROOT: ${{ github.workspace }}/tools
          SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          cd "$SOURCE_ROOT"
          node "$TOOLS_ROOT/apps/loom/dist/main.js" publication publish \
            --artifacts "$RUNNER_TEMP/release-set" --digest "$MANIFEST_DIGEST" \
            --head "$RELEASE_SOURCE" --repository "$GITHUB_REPOSITORY" \
            --run "$ARTIFACT_RUN" --artifact "$ARTIFACT_ID" --auth "$PUBLICATION_AUTH"
