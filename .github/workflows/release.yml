name: Release

# Reconciles npm, the annotated tag, and the GitHub Release with the participating manifest version.
# Every push to main runs it; a dispatch re-runs it at main's head. Every job holds one permission.
# See docs/decisions/0016-a-release-merge-publishes-through-one-idempotent-workflow.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  PNPM_VERSION: 12.3.2
  NODE_VERSION: 22.23.2
  BUN_VERSION: 1.4.0

jobs:
  plan:
    name: Release / plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      record: ${{ steps.plan.outputs.record }}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::The release workflow runs only at main; dispatch it from main. Got $REF."
            exit 1
          fi

      - name: Check out main with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the private Loom CLI
        run: pnpm build

      - name: Plan the reconciliation
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          node apps/loom/dist/main.js release plan --repository "$REPOSITORY" --output "$RUNNER_TEMP/plan/plan.json"
          jq -r '"version=\(.version)", "publish=\(.publish)", "record=\(.record)"' "$RUNNER_TEMP/plan/plan.json" >> "$GITHUB_OUTPUT"

      - name: Upload the plan
        uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan/plan.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Release / build
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit this run attests
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run the packed runtime consumer under Node and Bun
        run: pnpm check:packed

      - name: Pack every participating library
        run: pnpm --filter './packages/*' exec pnpm pack --pack-destination "$RUNNER_TEMP/tarballs"

      - name: Upload the tarballs
        uses: actions/upload-artifact@v7
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release / publish
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js 24 for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Require npm 11.5.1 or newer
        run: |
          node -e '
            const version = process.argv[1];
            const [major, minor, patch] = version.split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error("npm " + version + " cannot use trusted publishing; 11.5.1 or newer is required.");
              process.exit(1);
            }
          ' "$(npm --version)"

      - name: Download the tarballs
        uses: actions/download-artifact@v8
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs

      # Runs outside any checkout because the repository's devEngines setting rejects npm inside it.
      # A version that already exists on the registry counts as published.
      - name: Publish each tarball with provenance
        working-directory: ${{ runner.temp }}/tarballs
        run: |
          set -u
          status=0
          for tarball in *.tgz; do
            manifest="$(tar -xOf "$tarball" package/package.json)"
            spec="$(node -p 'const m = JSON.parse(process.argv[1]); m.name + "@" + m.version' "$manifest")"
            echo "::group::npm publish $tarball ($spec)"
            if npm publish "$tarball" --access public --provenance --ignore-scripts; then
              echo "Published $spec."
            elif npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on the registry; treating the conflict as published."
            else
              echo "::error::Publishing $spec failed and the version is absent from the registry."
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

  record:
    name: Release / record
    needs: [plan, build, publish]
    if: >-
      ${{ !cancelled()
        && needs.plan.result == 'success'
        && needs.plan.outputs.record == 'true'
        && (needs.build.result == 'success' || needs.build.result == 'skipped')
        && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the private Loom CLI
        run: pnpm build

      - name: Download the plan
        uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan

      - name: Record the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: node apps/loom/dist/main.js release record --repository "$REPOSITORY" --plan "$RUNNER_TEMP/plan/plan.json"
