name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress. A push to main never
# cancels another run, because each one has its own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Each Node process the tests start reuses compiled code instead of compiling it again.
  NODE_COMPILE_CACHE: ${{ github.workspace }}/../node-compile-cache

jobs:
  # A pull request that changes only documentation, a file under docs/ or a Markdown file at the
  # root or at the root of typescript/, runs the docs tests in place of the Linux test jobs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - name: Decide whether the change touches code
        id: paths
        env:
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub lists at most 3,000 files of a pull request, so a larger one counts as code.
          if [ "$EVENT" != pull_request ] || [ "$CHANGED_FILES" -gt 3000 ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths=$(gh api --paginate "repos/$REPOSITORY/pulls/$PULL_REQUEST/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          code=false
          if [ -z "$paths" ]; then
            code=true
          fi
          while IFS= read -r path; do
            case "$path" in
              '') ;;
              docs/*) ;;
              typescript/*/*) code=true ;;
              typescript/*.md) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$paths"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Changed paths touch code: $code"

  node_linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: node / ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    env:
      LOOM_TEST_RUNTIME: node
      LOOM_REQUIRE_SHELLS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
          node-version: 22.23.2

      # The examples are bundled with loom build, which runs bun build, and their source runs under Bun.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Nushell
        uses: ./.github/actions/install-nushell

      - name: Install the programs the tests run
        run: |
          sudo apt-get update && sudo apt-get install -y zsh fish bash-completion man-db
          # The single quotes keep the PowerShell variable from the shell.
          # shellcheck disable=SC2016
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Build, check types, and run process tests
        run: pnpm verify

      - name: Run the packed consumer
        run: pnpm check:packed

  # The macOS jobs declare no needs, so Hugi, which runs a job only when it has none, can run them
  # as declared in .github/hugi.yaml. They cannot read the changes job, so they run for every
  # change, a documentation-only one included.
  node_macos:
    name: node / macos-latest
    runs-on: macos-latest
    defaults:
      run:
        working-directory: typescript
    env:
      LOOM_TEST_RUNTIME: node
      LOOM_REQUIRE_SHELLS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0

      # No pnpm cache here: the lockfile sits in typescript/, and Hugi accepts only node-version and
      # cache as inputs to setup-node, so it cannot be given cache-dependency-path.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      # The examples are bundled with loom build, which runs bun build, and their source runs under Bun.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Nushell
        uses: ./.github/actions/install-nushell

      - name: Install the programs the tests run
        run: |
          brew install fish
          # The single quotes keep the PowerShell variable from the shell.
          # shellcheck disable=SC2016
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Build, check types, and run process tests
        run: pnpm verify

      - name: Run the packed consumer
        run: pnpm check:packed

  bun_linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: bun / ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    env:
      LOOM_TEST_RUNTIME: bun
      LOOM_REQUIRE_SHELLS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
          node-version: 22.23.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Nushell
        uses: ./.github/actions/install-nushell

      - name: Install the programs the tests run
        run: |
          sudo apt-get update && sudo apt-get install -y zsh fish bash-completion man-db
          # The single quotes keep the PowerShell variable from the shell.
          # shellcheck disable=SC2016
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      # The test workers run on Bun, and so do the children a process test starts under
      # LOOM_TEST_RUNTIME. The script runs vp's own file, because `bun --bun vp` would also make
      # `node` on PATH start Bun, and a test that starts `node` by name needs Node.
      - name: Build, check types, and run the tests under Bun
        run: pnpm verify:bun

      - name: Run the packed consumer
        run: pnpm check:packed

  bun_macos:
    name: bun / macos-latest
    runs-on: macos-latest
    defaults:
      run:
        working-directory: typescript
    env:
      LOOM_TEST_RUNTIME: bun
      LOOM_REQUIRE_SHELLS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0

      # No pnpm cache here: the lockfile sits in typescript/, and Hugi accepts only node-version and
      # cache as inputs to setup-node, so it cannot be given cache-dependency-path.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Nushell
        uses: ./.github/actions/install-nushell

      - name: Install the programs the tests run
        run: |
          brew install fish
          # The single quotes keep the PowerShell variable from the shell.
          # shellcheck disable=SC2016
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      # The test workers run on Bun, and so do the children a process test starts under
      # LOOM_TEST_RUNTIME. The script runs vp's own file, because `bun --bun vp` would also make
      # `node` on PATH start Bun, and a test that starts `node` by name needs Node.
      - name: Build, check types, and run the tests under Bun
        run: pnpm verify:bun

      - name: Run the packed consumer
        run: pnpm check:packed

  # A documentation-only change runs only the tests that read files under docs/ on Linux. Each such
  # test file carries `// @module-tag docs`. The macOS jobs run them too, as part of verify, and
  # verify's check:types is what compiles the docs pages' TypeScript examples on such a change, so
  # a change that gates the macOS jobs must move that check here.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    name: docs / ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    env:
      LOOM_TEST_RUNTIME: node
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
          node-version: 22.23.2

      # The installation tests run their fixtures under Node and Bun.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that every Markdown link resolves
        run: node scripts/check-links.mjs

      - name: Check that the diagnostics reference is current
        run: node scripts/generate-diagnostics.mjs --check

      - name: Build and run the tests that read docs
        run: pnpm run build && pnpm exec vp test --run --tagsFilter docs

  node:
    name: Node LTS / verify
    if: always()
    needs: [changes, node_linux, node_macos, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require macOS, and Linux or the docs tests for a documentation-only change
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.docs.result }}
          LINUX: ${{ needs.node_linux.result }}
          MACOS: ${{ needs.node_macos.result }}
        run: |
          printf 'changes=%s code=%s docs=%s node_linux=%s node_macos=%s\n' "$CHANGES" "$CODE" "$DOCS" "$LINUX" "$MACOS"
          test "$CHANGES" = success
          test "$MACOS" = success
          if [ "$CODE" = false ]; then
            echo "The change touches only documentation, so only the docs tests ran on Linux."
            test "$LINUX" = skipped && test "$DOCS" = success
          else
            test "$LINUX" = success
          fi

  bun:
    name: Bun / verify
    if: always()
    needs: [changes, bun_linux, bun_macos, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require macOS, and Linux or the docs tests for a documentation-only change
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.docs.result }}
          LINUX: ${{ needs.bun_linux.result }}
          MACOS: ${{ needs.bun_macos.result }}
        run: |
          printf 'changes=%s code=%s docs=%s bun_linux=%s bun_macos=%s\n' "$CHANGES" "$CODE" "$DOCS" "$LINUX" "$MACOS"
          test "$CHANGES" = success
          test "$MACOS" = success
          if [ "$CODE" = false ]; then
            echo "The change touches only documentation, so only the docs tests ran on Linux."
            test "$LINUX" = skipped && test "$DOCS" = success
          else
            test "$LINUX" = success
          fi
