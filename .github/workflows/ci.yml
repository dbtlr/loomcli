name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node_matrix:
    name: node / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      LOOM_TEST_RUNTIME: node
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22.23.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, check types, and run process tests
        run: pnpm verify

  bun_matrix:
    name: bun / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      LOOM_TEST_RUNTIME: bun
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22.23.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, check types, and run process tests
        run: pnpm verify

  node:
    name: Node LTS / verify
    if: always()
    needs: node_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require every operating system
        run: test "${{ needs.node_matrix.result }}" = "success"

  bun:
    name: Bun / verify
    if: always()
    needs: bun_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require every operating system
        run: test "${{ needs.bun_matrix.result }}" = "success"
