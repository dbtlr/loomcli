      - name: Install Nushell
        run: |
          set -euo pipefail
          version=0.117.0
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              target=x86_64-unknown-linux-gnu
              sum=33b907da92b0e80bd10fea9fa0e8a1624cabfebd89ee2568e365da3c492ffc68
              ;;
            macOS-ARM64)
              target=aarch64-apple-darwin
              sum=1d0e642ef3bff22113a82749a0fa24a0126f4fea0db46a5909e56e94a4b57527
              ;;
            macOS-X64)
              target=x86_64-apple-darwin
              sum=f44a99227d1fd19d7da9b4a60adbe32bf45700dc25f1a3cb08e4979dee0c1b2f
              ;;
            *)
              echo "No Nushell release is pinned for $RUNNER_OS-$RUNNER_ARCH." >&2
              exit 1
              ;;
          esac
          archive="nu-${version}-${target}.tar.gz"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "https://github.com/nushell/nushell/releases/download/${version}/${archive}"
          echo "${sum}  $RUNNER_TEMP/$archive" | shasum -a 256 --check -
          mkdir -p "$RUNNER_TEMP/nushell"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/nushell" --strip-components=1
          echo "$RUNNER_TEMP/nushell" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nushell/nu" --version

      - name: Install the programs the tests run
        run: |
          brew install fish
          # The single quotes keep the PowerShell variable from the shell.
          # shellcheck disable=SC2016
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Build, check types, and run process tests
        run: pnpm verify

      - name: Run the packed consumer
        run: pnpm check:packed

  bun_linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: bun / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      LOOM_TEST_RUNTIME: bun
      LOOM_REQUIRE_SHELLS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22.23.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests drive Nushell, which no package manager on the runners pins. The release binary's
      # checksum is checked, and a developer installs the same version.
      - name: Install Nushell
        run: |
          set -euo pipefail
          version=0.117.0
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              target=x86_64-unknown-linux-gnu
              sum=33b907da92b0e80bd10fea9fa0e8a1624cabfebd89ee2568e365da3c492ffc68
              ;;
            macOS-ARM64)
              target=aarch64-apple-darwin
              sum=1d0e642ef3bff22113a82749a0fa24a0126f4fea0db46a5909e56e94a4b57527
              ;;
            macOS-X64)
              target=x86_64-apple-darwin
              sum=f44a99227d1fd19d7da9b4a60adbe32bf45700dc25f1a3cb08e4979dee0c1b2f
              ;;
            *)
              echo "No Nushell release is pinned for $RUNNER_OS-$RUNNER_ARCH." >&2
