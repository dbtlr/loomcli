        run: pnpm verify:bun

      - name: Run the packed consumer
        run: pnpm check:packed

  # A documentation-only change runs only the tests that read files under docs/ on Linux. Each such
  # test file carries `// @module-tag docs`. The macOS jobs run them too, as part of verify, and
  # verify's check:types is what compiles the docs pages' TypeScript examples on such a change, so
  # a change that gates the macOS jobs must move that check here.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    name: docs / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      LOOM_TEST_RUNTIME: node
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22.23.2

      # The installation tests run their fixtures under Node and Bun.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that every Markdown link resolves
        run: node scripts/check-links.mjs

      - name: Check that the diagnostics reference is current
        run: node scripts/generate-diagnostics.mjs --check

      - name: Build and run the tests that read docs
        run: pnpm run build && pnpm exec vp test --run --tagsFilter docs

  node:
    name: Node LTS / verify
    if: always()
    needs: [changes, node_linux, node_macos, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require macOS, and Linux or the docs tests for a documentation-only change
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.docs.result }}
          LINUX: ${{ needs.node_linux.result }}
          MACOS: ${{ needs.node_macos.result }}
        run: |
          test "$CHANGES" = success
          test "$MACOS" = success
          if [ "$CODE" = false ]; then
            echo "The change touches only documentation, so only the docs tests ran on Linux."
            test "$LINUX" = skipped && test "$DOCS" = success
          else
            test "$LINUX" = success
          fi

  bun:
    name: Bun / verify
    if: always()
    needs: [changes, bun_linux, bun_macos, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require macOS, and Linux or the docs tests for a documentation-only change
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.docs.result }}
          LINUX: ${{ needs.bun_linux.result }}
          MACOS: ${{ needs.bun_macos.result }}
        run: |
          test "$CHANGES" = success
          test "$MACOS" = success
          if [ "$CODE" = false ]; then
            echo "The change touches only documentation, so only the docs tests ran on Linux."
            test "$LINUX" = skipped && test "$DOCS" = success
          else
            test "$LINUX" = success
          fi
