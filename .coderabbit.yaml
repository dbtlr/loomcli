# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Merge with the repository and organization settings in the CodeRabbit UI instead of replacing them.
inheritance: true
reviews:
  path_instructions:
    - path: 'typescript/.changes/*.md'
      instructions: |
        Change fragments are compiled into typescript/CHANGELOG.md, so their links resolve from typescript/, the changelog's directory, as typescript/.changes/README.md states.
        A link such as `[core reference](../docs/core/README.md)` is correct in a fragment.
        Do not report such links in these files as broken or ask to rewrite them relative to typescript/.changes/.
        The exception is typescript/.changes/README.md, which is a guide rather than a fragment and uses ordinary file-relative links.
