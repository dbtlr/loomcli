[package]
name = "loomcli-derive"
description = "The #[derive(Inputs)] and #[derive(Failure)] macros of Loom CLI, which expand to loomcli-core's builder calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
# The expansion's unit tests read where each compile error points, which needs span locations.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# The compile-fail examples and the expansion tests use the derives through the crate that
# re-exports them, as an author does.
loomcli-core = { path = "../loomcli-core" }
loomcli-testing = { path = "../loomcli-testing" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
