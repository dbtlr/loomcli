[package]
name = "loomcli-testing"
description = "Testing support for Loom CLI applications: the assembly check, the mock process, and context builders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
loomcli-core = { path = "../loomcli-core" }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
