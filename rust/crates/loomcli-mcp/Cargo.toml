[package]
name = "loomcli-mcp"
description = "A Model Context Protocol server over stdio and streamable HTTP: JSON-RPC framing, protocol revisions, and tool dispatch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true }
# The streamable HTTP transport serves HTTP/1.1 through hyper's server connection, on tokio
# sockets and timers through hyper-util; the transport's MCP rules stay hand-written over it.
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# Session ids are random version 4 UUIDs, drawn from the system's secure source.
uuid = { workspace = true, features = ["v4", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
