[package]
name = "loomcli-validators"
description = "The validator catalog of Loom CLI: text, integer, number, port, one_of, url, and the rest, with pipe and issue codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
loomcli-core = { path = "../loomcli-core" }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
url = { workspace = true }
regex = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
loomcli-testing = { path = "../loomcli-testing" }
tokio = { workspace = true, features = ["macros", "rt"] }
