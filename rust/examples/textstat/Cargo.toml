[package]
name = "textstat"
description = "Count bytes, words, or lines across text sources. The Rust port of the reference example."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
explain = { path = "../explain" }
loomcli-core = { path = "../../crates/loomcli-core" }
loomcli-plugins = { path = "../../crates/loomcli-plugins", features = [
    "config",
    "format",
    "help",
    "logging",
    "manifest",
    "suggestions",
    "table",
    "theme",
    "version",
] }
loomcli-validators = { path = "../../crates/loomcli-validators" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
conformance-harness = { workspace = true }
loomcli-testing = { path = "../../crates/loomcli-testing" }
tokio = { workspace = true, features = ["macros", "rt"] }
