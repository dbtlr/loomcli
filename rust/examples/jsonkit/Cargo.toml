[package]
name = "jsonkit"
description = "Read and reshape one JSON document. The Rust port of the reference example."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
doctor = { path = "../doctor" }
explain = { path = "../explain" }
loomcli-core = { path = "../../crates/loomcli-core" }
loomcli-plugins = { path = "../../crates/loomcli-plugins", features = [
    "color",
    "completion",
    "format",
    "help",
    "manifest",
    "manpage",
    "mcp",
    "records",
    "suggestions",
    "table",
    "theme",
    "verbose",
    "version",
] }
loomcli-validators = { path = "../../crates/loomcli-validators" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
conformance-harness = { workspace = true }
loomcli-testing = { path = "../../crates/loomcli-testing" }
tokio = { workspace = true, features = ["macros", "rt"] }
